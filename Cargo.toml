[package]
name = "digitus"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
aws-config = { version = "1.13.1", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = "1.146.0"
axum = "0.8"
lambda_http = "1.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
